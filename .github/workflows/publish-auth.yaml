name: Publish authentication image
run-name: Publish authentication image ${{ inputs.image_tag }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 鉴权专用补丁镜像版本，始终使用新标签
        required: true
        default: account-auth-20261113-v2
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-authentication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify account logic and concurrency
        run: |
          go test ./...
          go vet ./...
          go test -race ./internal/authsvc ./internal/backend
      - name: Verify MySQL including accounts without DELETE permission
        run: |
          docker pull mysql:8.0
          python3 scripts/test_mysql.py
      - name: Build authentication image
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            printf '::error::Invalid image tag\n'
            exit 2
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend:$REQUESTED_TAG"
          printf 'AUTH_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load --progress=plain \
            -f Dockerfile.golang --build-arg SERVICE=backend \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image" .
      - name: Publish authentication image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$AUTH_IMAGE"
      - name: Sign out
        if: always()
        run: docker logout ghcr.io
      - name: Verify anonymous download
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull "$AUTH_IMAGE"
