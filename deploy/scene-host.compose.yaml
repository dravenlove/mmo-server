name: mmo-scene

x-scene: &scene
  image: ${MMO_IMAGE_PREFIX:-mmo}/scene:${MMO_IMAGE_TAG:-dev}
  build:
    context: ..
    dockerfile: Dockerfile.scene
    args:
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 20s
  healthcheck:
    test: [CMD-SHELL, 'curl --fail --silent --max-time 2 "http://127.0.0.1:$$SCENE_PORT/healthz" >/dev/null']
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

x-scene-environment: &scene-environment
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set the shared random INTERNAL_TOKEN}
  SCENE_HOST: 0.0.0.0
  TICK_HZ: ${TICK_HZ:-20}
  AOI_RADIUS: ${AOI_RADIUS:-30}
  MOVE_SPEED: ${MOVE_SPEED:-6}

services:
  scene1:
    <<: *scene
    environment:
      <<: *scene-environment
      SCENE_ID: scene-1
      SCENE_PORT: "9001"
    ports:
      - "${SCENE_BIND_IP:?Set scene host private or VPN IP}:9001:9001"
  scene2:
    <<: *scene
    environment:
      <<: *scene-environment
      SCENE_ID: scene-2
      SCENE_PORT: "9002"
    ports:
      - "${SCENE_BIND_IP:?Set scene host private or VPN IP}:9002:9002"
