services:
  scene:
    image: ${MMO_IMAGE_PREFIX:-mmo}/scene:${MMO_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set the shared random INTERNAL_TOKEN}
      SCENE_ID: ${SCENE_ID:?Set a unique scene ID}
      SCENE_HOST: 0.0.0.0
      SCENE_PORT: ${SCENE_PORT:-9001}
      TICK_HZ: ${TICK_HZ:-20}
      AOI_RADIUS: ${AOI_RADIUS:-30}
      MOVE_SPEED: ${MOVE_SPEED:-6}
    ports:
      - "${SCENE_BIND_IP:-127.0.0.1}:${SCENE_PORT:-9001}:${SCENE_PORT:-9001}"
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 2 "http://127.0.0.1:$$SCENE_PORT/healthz" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
