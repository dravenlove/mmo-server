name: mmo-game

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-scene: &scene
  <<: *runtime
  image: ${MMO_IMAGE_PREFIX:-mmo}/scene:${MMO_IMAGE_TAG:-dev}
  build:
    context: ..
    dockerfile: Dockerfile.scene
    args:
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
  volumes:
    - type: bind
      source: ${COMBAT_CONFIG_DIR:-./combat-config}
      target: /app/config
      read_only: true
  healthcheck:
    test: [CMD-SHELL, 'curl --fail --silent --max-time 2 "http://127.0.0.1:$$SCENE_PORT/healthz" >/dev/null']
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  scene1:
    <<: *scene
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set a random INTERNAL_TOKEN of at least 32 characters in .env}
      SCENE_ID: scene-1
      SCENE_HOST: 0.0.0.0
      SCENE_PORT: "9001"
      TICK_HZ: ${TICK_HZ:-20}
      AOI_RADIUS: ${AOI_RADIUS:-30}
      MOVE_SPEED: ${MOVE_SPEED:-6}
      COMBAT_CONFIG_FILE: ${COMBAT_CONFIG_FILE:-}
    ports:
      - "127.0.0.1:9001:9001"

  scene2:
    <<: *scene
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set a random INTERNAL_TOKEN of at least 32 characters in .env}
      SCENE_ID: scene-2
      SCENE_HOST: 0.0.0.0
      SCENE_PORT: "9002"
      TICK_HZ: ${TICK_HZ:-20}
      AOI_RADIUS: ${AOI_RADIUS:-30}
      MOVE_SPEED: ${MOVE_SPEED:-6}
      COMBAT_CONFIG_FILE: ${COMBAT_CONFIG_FILE:-}
    ports:
      - "127.0.0.1:9002:9002"

  backend:
    <<: *runtime
    image: ${MMO_IMAGE_PREFIX:-mmo}/backend:${MMO_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: Dockerfile.golang
      args:
        SERVICE: backend
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set a random INTERNAL_TOKEN of at least 32 characters in .env}
      AUTH_URL: ${AUTH_URL:?Set the encrypted authentication endpoint}
      BACKEND_LISTEN: 0.0.0.0:8081
      BACKEND_DB: /app/data/mmo.db
      BACKEND_DB_DRIVER: ${BACKEND_DB_DRIVER:-sqlite}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      MYSQL_TLS: ${MYSQL_TLS:-false}
      SCENES: scene-1=http://scene1:9001,scene-2=http://scene2:9002,scene-webgl=http://scene-webgl:9003,scene-combat=http://scene-combat:9004
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - backend-data:/app/data
    depends_on:
      scene1:
        condition: service_healthy
      scene2:
        condition: service_healthy
      scene-webgl:
        condition: service_healthy
      scene-combat:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway:
    <<: *runtime
    image: ${MMO_IMAGE_PREFIX:-mmo}/gateway:${MMO_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: Dockerfile.golang
      args:
        SERVICE: gateway
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set a random INTERNAL_TOKEN of at least 32 characters in .env}
      BACKEND_URL: http://backend:8081
      GATEWAY_LISTEN: 0.0.0.0:7000
      GATEWAY_HEALTH_LISTEN: 0.0.0.0:8080
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:7000:7000"
      - "127.0.0.1:8080:8080"
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  scene-webgl:
    <<: *scene
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set the shared random INTERNAL_TOKEN}
      SCENE_ID: scene-webgl
      SCENE_HOST: 0.0.0.0
      SCENE_PORT: "9003"
      SCENE_MODE: movement
      TICK_HZ: ${WEBGL_TICK_HZ:-20}
      AOI_RADIUS: ${WEBGL_AOI_RADIUS:-30}
      MOVE_SPEED: ${WEBGL_MOVE_SPEED:-6}
      TRACE_MOVEMENT: ${WEBGL_TRACE_MOVEMENT:-true}
    ports:
      - "127.0.0.1:9003:9003"

  gateway-webgl:
    <<: *runtime
    image: ${MMO_IMAGE_PREFIX:-mmo}/gateway:${MMO_IMAGE_TAG:-dev}
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set the shared random INTERNAL_TOKEN}
      BACKEND_URL: http://backend:8081
      GATEWAY_LISTEN: 0.0.0.0:7000
      GATEWAY_HEALTH_LISTEN: 0.0.0.0:8080
      GATEWAY_PROFILE: movement
      GATEWAY_LOGIN_SCENE: scene-webgl
      TRACE_MOVEMENT: ${WEBGL_TRACE_MOVEMENT:-true}
    ports:
      - "127.0.0.1:7002:7000"
      - "127.0.0.1:8083:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  scene-combat:
    <<: *scene
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set the shared random INTERNAL_TOKEN}
      SCENE_ID: scene-combat
      SCENE_HOST: 0.0.0.0
      SCENE_PORT: "9004"
      SCENE_MODE: abilities
      PVP_ENABLED: ${COMBAT_PVP_ENABLED:-true}
      TICK_HZ: "20"
      AOI_RADIUS: "30"
      MOVE_SPEED: "6"
    ports:
      - "127.0.0.1:9004:9004"

  gateway-combat:
    <<: *runtime
    image: ${MMO_IMAGE_PREFIX:-mmo}/gateway:${MMO_IMAGE_TAG:-dev}
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set the shared random INTERNAL_TOKEN}
      BACKEND_URL: http://backend:8081
      GATEWAY_LISTEN: 0.0.0.0:7000
      GATEWAY_HEALTH_LISTEN: 0.0.0.0:8080
      GATEWAY_PROFILE: abilities
      GATEWAY_LOGIN_SCENE: scene-combat
    ports:
      - "127.0.0.1:7003:7000"
      - "127.0.0.1:8084:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  backend-data:
    name: ${BACKEND_VOLUME_NAME:-mmo-two-host-backend-data}
